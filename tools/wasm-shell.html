<!doctype html>
<!-- tools/wasm-shell.html — the emscripten shell-file for `make wasm` (W4, OFI-213). Provides the
     app mount point (div#app) that flare.html() renders into, plus a delegated click listener queuing
     each clicked widget's data-fl-id for the Ingle loop (web_next_click drains globalThis.__ingleClicks).
     (No line here may start with '#' — emscripten's shell preprocessor reads that as a directive.) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ingle · Flare (WASM)</title>
</head>
<body style="margin:0">
<div id="app" style="padding:1rem;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">loading Ingle → WASM…</div>
<script>
  // Delegated click bridge: queue each clicked widget's data-fl-id for the Ingle loop (web_next_click).
  // Inputs/textareas are skipped here (a click there is focus/caret, not a widget action) — they feed
  // the input bridge below instead, and are left alone so focus and caret placement work normally.
  globalThis.__ingleClicks = [];
  globalThis.__ingleInputs = [];
  function isTextField(el) { return el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA'); }
  function isControl(el) { return isTextField(el) || (el && el.tagName === 'SELECT'); }
  document.addEventListener('click', function (e) {
    var el = e.target && e.target.closest ? e.target.closest('[data-fl-id]') : null;
    // A control (field / range / select) drives itself and reports via the input bridge — don't also fire
    // a widget click for it. Everything else (buttons, nav, checkbox, tabs) is a click.
    if (el && !isControl(el)) { e.preventDefault(); globalThis.__ingleClicks.push(el.getAttribute('data-fl-id')); }
  });
  // Delegated input bridge: a field's keystroke, a range's drag, or a select's change queues "id\tvalue"
  // so the Ingle loop (web_next_input) mirrors the control's value into Flare's state.
  document.addEventListener('input', function (e) {
    var el = e.target;
    if (isControl(el) && el.hasAttribute('data-fl-id')) {
      globalThis.__ingleInputs.push(el.getAttribute('data-fl-id') + '\t' + el.value);
    }
  });

  // ingleMorph patches the live DOM toward `html` IN PLACE instead of replacing innerHTML — so an
  // unchanged node keeps its identity (no flicker, and focus / selection / scroll survive a re-render).
  // web_set_html calls this each frame; it is also what makes SSR hydration seamless (the client's first
  // frame morphs onto the server-rendered #app, a no-op when their states match). Index-based reconcile —
  // enough for Flare's stable frame structure, where a re-render changes text/attrs, not shape.
  function morphNode(oldN, newN) {
    if (oldN.nodeType === 3 && newN.nodeType === 3) {          // both text
      if (oldN.nodeValue !== newN.nodeValue) { oldN.nodeValue = newN.nodeValue; }
      return;
    }
    if (oldN.nodeType !== newN.nodeType || oldN.nodeName !== newN.nodeName) {
      oldN.replaceWith(newN.cloneNode(true));
      return;
    }
    if (oldN.nodeType === 1) {                                 // element: sync attrs, then children
      for (var k = oldN.attributes.length - 1; k >= 0; k--) {
        var an = oldN.attributes[k].name;
        if (!newN.hasAttribute(an)) { oldN.removeAttribute(an); }
      }
      for (var m = 0; m < newN.attributes.length; m++) {
        var a = newN.attributes[m];
        if (oldN.getAttribute(a.name) !== a.value) { oldN.setAttribute(a.name, a.value); }
      }
      // Form fields: the browser owns .value while the user types. Only push a value the app CHANGED
      // (differs from the live field) — a no-op during typing (Flare already mirrored it), so the caret is
      // never disturbed; a real change (e.g. clearing after submit) applies and the caret is kept if focused.
      if (isTextField(oldN)) {
        var nv = oldN.tagName === 'TEXTAREA' ? newN.textContent : (newN.getAttribute('value') || '');
        if (oldN.value !== nv) {
          var focused = document.activeElement === oldN, at = focused ? oldN.selectionStart : 0;
          oldN.value = nv;
          if (focused) { try { oldN.setSelectionRange(at, at); } catch (e) {} }
        }
        return;   // do not morph a field's children (a textarea's text is its .value, handled above)
      }
      // <select>: reconcile the <option>s, then set the value from the newly-selected option (unless the
      // user has it open/focused) so a programmatic change applies without fighting an active selection.
      if (oldN.tagName === 'SELECT') {
        morphChildren(oldN, [].slice.call(newN.childNodes));
        var selOpt = newN.querySelector('option[selected]');
        var sv = selOpt ? (selOpt.getAttribute('value') || '') : '';
        if (document.activeElement !== oldN && oldN.value !== sv) { oldN.value = sv; }
        return;
      }
      morphChildren(oldN, [].slice.call(newN.childNodes));
    }
  }
  function morphChildren(parent, newKids) {
    for (var j = 0; j < newKids.length; j++) {
      if (parent.childNodes[j]) { morphNode(parent.childNodes[j], newKids[j]); }
      else { parent.appendChild(newKids[j].cloneNode(true)); }
    }
    while (parent.childNodes.length > newKids.length) { parent.removeChild(parent.lastChild); }
  }
  globalThis.ingleMorph = function (root, html) {
    var tpl = document.createElement('template');
    tpl.innerHTML = html;
    morphChildren(root, [].slice.call(tpl.content.childNodes));
  };
</script>
{{{ SCRIPT }}}
</body>
</html>
